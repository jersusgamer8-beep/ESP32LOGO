<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Relé - ESP32</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
    .btn { padding: 15px 40px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; margin: 10px; }
    .btn-on { background-color: #28a745; }
    .btn-off { background-color: #dc3545; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <h2>Control Remoto de Relé</h2>
  <button class="btn btn-on" onclick="cambiarEstado(true)">ENCENDER (ON)</button>
  <button class="btn btn-off" onclick="cambiarEstado(false)">APAGAR (OFF)</button>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    // Configuración de tu proyecto Firebase
    const firebaseConfig = {
      databaseURL: "https://eps32logo-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function cambiarEstado(val) {
      database.ref('/estadoRelay').set(val);
    }
  </script>
</body>
</html>
